name: build-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 1. 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          free -g | head -2

      - name: 2. 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev xz-utils cpio rsync clang lld llvm
          for t in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip clang; do
            command -v $t || echo "警告：缺少 $t"
          done
          clang --version | head -2

      - name: 3. 下载 AOSP clang r563880c（与设备内核完全同版本）
        run: |
          BASE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          mkdir -p "$HOME/tc"
          URL="$BASE/+archive/refs/heads/android17-release/clang-r563880c.tar.gz"
          echo "下载 $URL"
          if curl -fSL --retry 3 --retry-delay 5 --max-time 900 "$URL" -o /tmp/tc.tar.gz; then
            echo "解压 ..."
            tar xzf /tmp/tc.tar.gz -C "$HOME/tc"
            echo "TOOLCHAIN=$HOME/tc" >> "$GITHUB_ENV"
            "$HOME/tc/bin/clang" --version | head -1
          else
            echo "!! 下载失败，回退系统 clang"
            clang --version | head -1
          fi

      - name: 4. 拉取源码（android-16）
        run: |
          git clone --depth 1 -b android-16 https://github.com/Gamesmes90/android_kernel_oneplus_sm8350.git k
          cd k && git log --oneline -1 && grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" Makefile

      - name: 5. 初始化 KernelSU
        run: |
          cd k
          chmod +x init_ksu.sh
          bash ./init_ksu.sh susfs || bash ./init_ksu.sh
          ls -l drivers/kernelsu/Kconfig || { echo "KernelSU 未初始化"; exit 1; }

      - name: 6. 打 Droidspaces 补丁
        run: |
          cd k
          cat > /tmp/ds.patch <<'PATCH_EOF'
          diff --git a/arch/arm64/configs/vendor/lahaina-qgki_defconfig b/arch/arm64/configs/vendor/lahaina-qgki_defconfig
          index 60660d94a..f25580d55 100644
          --- a/arch/arm64/configs/vendor/lahaina-qgki_defconfig
          +++ b/arch/arm64/configs/vendor/lahaina-qgki_defconfig
          @@ -1034,3 +1034,12 @@ CONFIG_HZ=250
           CONFIG_CRYPTO_LZO=y
           CONFIG_LZO_COMPRESS=y
           CONFIG_LZO_DECOMPRESS=y
          +
          +#
          +# Droidspaces: base container support (minimal set)
          +# 只开 Droidspaces 启动容器必需的四个选项
          +#
          +CONFIG_SYSVIPC=y
          +CONFIG_IPC_NS=y
          +CONFIG_PID_NS=y
          +CONFIG_POSIX_MQUEUE=y
          diff --git a/include/linux/sched.h b/include/linux/sched.h
          index ead16db8e..c29489857 100644
          --- a/include/linux/sched.h
          +++ b/include/linux/sched.h
          @@ -1098,8 +1098,8 @@ struct task_struct {
           	struct nameidata		*nameidata;
           
           #ifdef CONFIG_SYSVIPC
          -	struct sysv_sem			sysvsem;
          -	struct sysv_shm			sysvshm;
          +	// struct sysv_sem			sysvsem;
          +	// struct sysv_shm			sysvshm;
           #endif
           #ifdef CONFIG_DETECT_HUNG_TASK
           	/* hung task detection */
          @@ -1489,9 +1489,15 @@ struct task_struct {
           	ANDROID_KABI_RESERVE(3);
           	ANDROID_KABI_RESERVE(4);
           	ANDROID_KABI_RESERVE(5);
          +
          +#ifdef CONFIG_SYSVIPC
          +	ANDROID_KABI_USE(6, struct sysv_sem sysvsem);
          +	_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);
          +#else
           	ANDROID_KABI_RESERVE(6);
           	ANDROID_KABI_RESERVE(7);
           	ANDROID_KABI_RESERVE(8);
          +#endif
           
           	/*
           	 * New fields for task_struct should be added above here, so that
          diff --git a/include/linux/sched/user.h b/include/linux/sched/user.h
          index 573b448e0..391451665 100644
          --- a/include/linux/sched/user.h
          +++ b/include/linux/sched/user.h
          @@ -23,7 +23,7 @@ struct user_struct {
           #endif
           #ifdef CONFIG_POSIX_MQUEUE
           	/* protected by mq_lock	*/
          -	unsigned long mq_bytes;	/* How many bytes can be allocated to mqueue? */
          +	// unsigned long mq_bytes;	/* How many bytes can be allocated to mqueue? */
           #endif
           	unsigned long locked_shm; /* How many pages of mlocked shm ? */
           	unsigned long unix_inflight;	/* How many files in flight in unix sockets */
          @@ -41,7 +41,11 @@ struct user_struct {
           	/* Miscellaneous per-user rate limit */
           	struct ratelimit_state ratelimit;
           
          +#ifdef CONFIG_POSIX_MQUEUE
          +	ANDROID_KABI_USE(1, unsigned long mq_bytes);
          +#else
           	ANDROID_KABI_RESERVE(1);
          +#endif
           	ANDROID_KABI_RESERVE(2);
           };
           
          PATCH_EOF
          git apply --check /tmp/ds.patch
          git apply /tmp/ds.patch

      - name: 7. 生成配置 + 锁版本 + 关调试信息
        run: |
          export LOCALVERSION=
          cd k
          cat >> arch/arm64/configs/vendor/lahaina-qgki_defconfig <<'CFG_EOF'

          CONFIG_LOCALVERSION="-qgki-gf817ef05c1c2"
          # CONFIG_LOCALVERSION_AUTO is not set
          # 关掉调试信息：只为省内存/磁盘/时间，不影响运行时和符号 CRC
          # CONFIG_DEBUG_INFO is not set
          CFG_EOF
          make O=out ARCH=arm64 LLVM=1 vendor/lahaina-qgki_defconfig
          for o in SYSVIPC IPC_NS PID_NS POSIX_MQUEUE KSU; do
            grep -q "^CONFIG_${o}=y" out/.config || { echo "缺少 CONFIG_$o"; exit 1; }
          done
          grep -E "^CONFIG_(LOCALVERSION|DEBUG_INFO)" out/.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig >/dev/null
          REL=$(make -s O=out ARCH=arm64 LLVM=1 kernelrelease)
          echo "kernelrelease = $REL"
          [ "$REL" = "5.4.302-qgki-gf817ef05c1c2" ] || { echo "版本号不对"; exit 1; }

      - name: 8. 编译（-j2，完整日志留档）
        run: |
          export LOCALVERSION=
          [ -n "${TOOLCHAIN:-}" ] && export PATH="$TOOLCHAIN/bin:$PATH"
          mkdir -p dist
          set -o pipefail
          make -C k O=out ARCH=arm64 LLVM=1 KCFLAGS="-Wno-error" -j2 Image > /tmp/build.log 2>&1 || {
            echo "===== 编译失败，最后 120 行 ====="
            tail -120 /tmp/build.log
            cp /tmp/build.log dist/ 2>/dev/null
            exit 1
          }
          tail -20 /tmp/build.log
          cp /tmp/build.log dist/

      - name: 9. 校验并打包
        run: |
          IMG=k/out/arch/arm64/boot/Image
          ls -lh "$IMG"
          sha256sum "$IMG"
          strings -a "$IMG" | grep -m1 "^Linux version"
          strings -a "$IMG" | grep -q "5.4.302-qgki-gf817ef05c1c2" || { echo "版本号不对"; exit 1; }
          mkdir -p dist
          cp "$IMG" dist/Image
          cp k/out/.config dist/config.built
          [ -f k/out/Module.symvers ] && cp k/out/Module.symvers dist/
          clang --version > dist/clang.txt
          ls -lh dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-dist
          path: dist/
          retention-days: 7
          if-no-files-found: warn
